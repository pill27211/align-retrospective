version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ================================ 로컬 캐시 ================================
  travel-redis:
    image: valkey/valkey:8-alpine
    container_name: travel-redis
    ports:
      - "6379:6379"
    command:
      - sh
      - -c
      - valkey-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    logging: *default-logging
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - travel-network

  # ================================ Nginx (의존성 제거) ================================
  nginx:
    image: nginx:alpine
    container_name: travel-nginx
    ports:
      - "80:80"
      - "443:443"
    logging: *default-logging
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /home/web:/var/www/web:ro
      - /home/tech:/var/www/tech:ro
      - /home/binkan:/var/www/binkan:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/html:/var/www/html
      - /var/log/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - travel-network

  # ================================ 로컬 DB (MySQL 8.0) ================================
  travel-mysql:
    image: mysql:8.0.43
    container_name: travel-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - TZ=Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=100
      - --innodb_buffer_pool_size=128M
    logging: *default-logging
    volumes:
      - mysql_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    restart: unless-stopped
    networks:
      - travel-network

