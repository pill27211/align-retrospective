# =====================================================================
# Align 백엔드 리버스 프록시 (발췌·정제 버전)
# - 실제 운영 config에서 아키텍처와 무관한 정적 사이트 블록,
#   실제 관리자 IP 화이트리스트 등은 제거했습니다.
# - 도메인/인증서 경로는 예시값입니다.
# =====================================================================

# 점검 모드 스위치 (1 = 점검, 0 = 정상)
map $host $maintenance_mode {
    default 0;
}

# message-server 인스턴스 클러스터 (Socket.IO)
upstream message_cluster {
    server message-server:60008;
}

server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl;
    server_name example.com www.example.com;

    client_max_body_size 15M;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    charset utf-8;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---- 점검 모드 ----
    set $maintenance $maintenance_mode;
    error_page 503 @maintenance;
    location @maintenance {
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Retry-After 3600 always;
        return 503 '{"code":"MAINTENANCE","message":"서버 점검 중입니다.","retryAfter":3600}';
    }
    if ($maintenance = 1) { return 503; }

    # Docker 내장 DNS 동적 확인 (컨테이너 IP 캐싱 방지)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ---- REST API → main-server ----
    location /api/ {
        set $main_server "http://main-server:60007";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $main_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 업로드 → upload-server ----
    location /upload/ {
        set $upload_server "http://upload-server:60006";
        rewrite ^/upload/(.*)$ /$1 break;
        proxy_pass $upload_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket → message_cluster ----
    location /socket.io/ {
        proxy_pass http://message_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_socket_keepalive on;
        proxy_read_timeout 90s;
        proxy_buffering off;      # 실시간 통신 최적화
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 관리자 백엔드 (운영 시 IP 화이트리스트 적용) ----
    location /api/admin/ {
        # allow <office-ip>;   # 실제 운영에서는 관리자 IP만 허용
        # deny all;
        proxy_pass http://main-server:60007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
